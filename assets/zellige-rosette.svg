<rect x="-63" y="-63" width="126" height="126" fill="#d6b46c" fill-opacity=".16" stroke="#d6b46c"/>
<rect x="-63" y="-63" width="126" height="126" transform="rotate(45)" fill="#73d9c7" fill-opacity=".12" stroke="#73d9c7"/>
<!-- segmented tesserae arranged between the two stars -->
<path d="M0 -89 L21 -64 0 -42 -21 -64Z M89 0 L64 21 42 0 64 -21Z M0 89 L-21 64 0 42 21 64Z M-89 0 L-64 -21 -42 0 -64 21Z" fill="#73d9c7" fill-opacity=".25" stroke="#73d9c7"/>
