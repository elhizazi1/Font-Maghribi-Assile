<path d="M0 -42 L25 -25 42 0 25 25 0 42 -25 25 -42 0 -25 -25Z" fill="#0d6f6d" fill-opacity=".28" stroke="#d6b46c"/>
<path d="M0 -28 L20 -20 28 0 20 20 0 28 -20 20 -28 0 -20 -20Z" fill="#73d9c7" fill-opacity=".35" stroke="#f1d99b"/>
<path d="M0 -16 L16 0 0 16 -16 0Z" fill="#d6b46c" fill-opacity=".45" stroke="#d6b46c"/>
</g>
<g id="connector" stroke="#d6b46c" stroke-opacity=".6" stroke-width="2" fill="none"><path d="M-25 0L0 -25L25 0L0 25Z"/><path d="M-12 0L0 -12L12 0L0 12Z" stroke="#73d9c7"/></g></defs>
<g transform="translate(210 210)"><use href="#rosette"/><use href="#rosette" transform="translate(-190 -190) scale(.52)"/><use href="#rosette" transform="translate(190 -190) scale(.52)"/><use href="#rosette" transform="translate(-190 190) scale(.52)"/><use href="#rosette" transform="translate(190 190) scale(.52)"/>
<use href="#connector" transform="translate(0 -154)"/><use href="#connector" transform="translate(154 0)"/><use href="#connector" transform="translate(0 154)"/><use href="#connector" transform="translate(-154 0)"/>
